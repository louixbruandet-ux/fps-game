<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arena FPS</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; color: #fff; }
  canvas { display: block; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 18px; height: 18px; transform: translate(-50%, -50%); pointer-events: none; }
  #crosshair::before, #crosshair::after { content: ""; position: absolute; background: #fff; }
  #crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
  #crosshair::after { top: 8px; left: 0; height: 2px; width: 18px; }
  #hud { position: fixed; left: 20px; bottom: 20px; font-size: 20px; text-shadow: 0 0 4px #000; pointer-events: none; line-height: 1.5; }
  #hpbar { width: 220px; height: 14px; background: #400; border: 2px solid #fff; }
  #hpfill { height: 100%; background: #e33; width: 100%; transition: width .1s; }
  #damage { position: fixed; inset: 0; background: radial-gradient(transparent 40%, rgba(255,0,0,.6)); opacity: 0; pointer-events: none; transition: opacity .3s; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,.6); cursor: pointer; text-align: center; }
  #overlay h1 { font-size: 56px; margin: 0 0 10px; letter-spacing: 4px; }
  #overlay p { margin: 4px; opacity: .85; }
</style>
</head>
<body>
<div id="crosshair"></div>
<div id="damage"></div>
<div id="hud">
  <div id="hpbar"><div id="hpfill"></div></div>
  <div>Ammo: <span id="ammo">12</span> / 12</div>
  <div>Wave: <span id="wave">1</span> &nbsp; Score: <span id="score">0</span></div>
</div>
<div id="overlay">
  <h1>ARENA FPS</h1>
  <p id="msg">Click to play</p>
  <p>WASD move · Mouse aim · Click shoot · Space jump · Shift sprint · R reload</p>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";
import { Sky } from "three/addons/objects/Sky.js";

// ---------- Setup ----------
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xbcc8d0, 40, 170);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
document.body.appendChild(renderer.domElement);
const maxAniso = renderer.capabilities.getMaxAnisotropy();

// Sky + sun
const sunDir = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(52), THREE.MathUtils.degToRad(135));
const sky = new Sky();
sky.scale.setScalar(1000);
const su = sky.material.uniforms;
su.turbidity.value = 8; su.rayleigh.value = 1.2; su.mieCoefficient.value = 0.005; su.mieDirectionalG.value = 0.8;
su.sunPosition.value.copy(sunDir);
scene.add(sky);

scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x6b5a40, 1.1));
const sun = new THREE.DirectionalLight(0xfff1d6, 3);
sun.position.copy(sunDir).multiplyScalar(100);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 1, far: 250 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun);

const controls = new PointerLockControls(camera, document.body);
scene.add(controls.getObject());

// ---------- Procedural textures ----------
const rand = (a, b) => a + Math.random() * (b - a);
function canvasTex(size, draw) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  draw(c.getContext("2d"), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  return t;
}
function speckle(g, s, n, alpha) {
  for (let i = 0; i < n; i++) {
    const v = Math.random() < 0.5 ? 0 : 255, r = rand(0.5, 2.5);
    g.fillStyle = `rgba(${v},${v},${v},${Math.random() * alpha})`;
    g.fillRect(Math.random() * s, Math.random() * s, r, r);
  }
}
function blotches(g, s, n, color, maxR) {
  for (let i = 0; i < n; i++) {
    const x = Math.random() * s, y = Math.random() * s, r = rand(maxR * 0.3, maxR);
    for (const ox of [-s, 0, s]) for (const oy of [-s, 0, s]) { // wrap so it tiles
      const gr = g.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, r);
      gr.addColorStop(0, color); gr.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = gr; g.fillRect(x + ox - r, y + oy - r, r * 2, r * 2);
    }
  }
}
const fill = (g, s, c) => { g.fillStyle = c; g.fillRect(0, 0, s, s); };

const TEX = {
  dirt: canvasTex(512, (g, s) => { fill(g, s, "#7d6d52"); blotches(g, s, 40, "rgba(60,45,30,0.25)", 90); blotches(g, s, 30, "rgba(170,150,110,0.2)", 70); speckle(g, s, 25000, 0.25); }),
  asphalt: canvasTex(512, (g, s) => { fill(g, s, "#38393b"); blotches(g, s, 20, "rgba(0,0,0,0.2)", 100); speckle(g, s, 40000, 0.3); }),
  concrete: canvasTex(512, (g, s) => {
    fill(g, s, "#a19e96"); blotches(g, s, 25, "rgba(80,75,65,0.15)", 90); speckle(g, s, 20000, 0.15);
    g.strokeStyle = "rgba(0,0,0,0.25)"; g.lineWidth = 3; g.strokeRect(0, 0, s, s);
  }),
  brick: canvasTex(512, (g, s) => {
    fill(g, s, "#a89c8a");
    const rows = 24, cols = 8, bh = s / rows, bw = s / cols;
    for (let r = 0; r < rows; r++) for (let c = -1; c <= cols; c++) {
      g.fillStyle = `hsl(${rand(8, 20)},${rand(35, 50)}%,${rand(26, 38)}%)`;
      g.fillRect(c * bw + (r % 2) * bw / 2 + 1.5, r * bh + 1.5, bw - 3, bh - 3);
    }
    speckle(g, s, 15000, 0.2);
  }),
  plaster: canvasTex(512, (g, s) => { fill(g, s, "#c9b896"); blotches(g, s, 30, "rgba(120,100,70,0.15)", 100); speckle(g, s, 20000, 0.12); }),
  roof: canvasTex(256, (g, s) => { fill(g, s, "#4d4b48"); speckle(g, s, 15000, 0.35); }),
  crate: canvasTex(256, (g, s) => {
    fill(g, s, "#a07a48");
    g.strokeStyle = "rgba(60,40,20,0.15)"; g.lineWidth = 1;
    for (let i = 0; i < 120; i++) { const y = Math.random() * s; g.beginPath(); g.moveTo(0, y); g.lineTo(s, y + rand(-4, 4)); g.stroke(); }
    g.fillStyle = "rgba(0,0,0,0.35)"; for (let i = 1; i < 5; i++) g.fillRect(0, i * s / 5, s, 2);
    g.strokeStyle = "#7a5a32"; g.lineWidth = 22; g.strokeRect(11, 11, s - 22, s - 22);
    g.lineWidth = 20; g.beginPath(); g.moveTo(20, 20); g.lineTo(s - 20, s - 20); g.stroke();
    speckle(g, s, 3000, 0.2);
  }),
  wood: canvasTex(256, (g, s) => {
    fill(g, s, "#7a5634");
    g.strokeStyle = "rgba(40,25,10,0.25)";
    for (let i = 0; i < 80; i++) { const y = Math.random() * s; g.beginPath(); g.moveTo(0, y); g.lineTo(s, y + rand(-3, 3)); g.stroke(); }
    speckle(g, s, 3000, 0.2);
  }),
  metal: canvasTex(256, (g, s) => {
    fill(g, s, "#c8c8c8");
    for (let x = 0; x < s; x += 16) { g.fillStyle = "rgba(255,255,255,0.18)"; g.fillRect(x, 0, 6, s); g.fillStyle = "rgba(0,0,0,0.22)"; g.fillRect(x + 9, 0, 5, s); }
    blotches(g, s, 15, "rgba(110,60,30,0.3)", 30); speckle(g, s, 6000, 0.2);
  }),
  rust: canvasTex(256, (g, s) => { fill(g, s, "#bbbbbb"); blotches(g, s, 25, "rgba(120,60,25,0.5)", 35); speckle(g, s, 8000, 0.25); }),
  sandbag: canvasTex(256, (g, s) => {
    fill(g, s, "#6f5f40");
    for (let r = 0; r < 4; r++) for (let c = -1; c <= 2; c++) {
      const cx = c * 128 + (r % 2) * 64 + 64, cy = r * 64 + 32;
      const gr = g.createRadialGradient(cx - 15, cy - 10, 5, cx, cy, 66);
      gr.addColorStop(0, "#c2ae80"); gr.addColorStop(1, "#7f6c48");
      g.fillStyle = gr; g.beginPath(); g.ellipse(cx, cy, 62, 29, 0, 0, Math.PI * 2); g.fill();
    }
    speckle(g, s, 8000, 0.2);
  }),
  canvas: canvasTex(256, (g, s) => { fill(g, s, "#6c7048"); blotches(g, s, 15, "rgba(40,40,20,0.2)", 50); speckle(g, s, 8000, 0.15); }),
  barrel: canvasTex(128, (g, s) => {
    fill(g, s, "#dddddd");
    for (const y of [38, 86]) { g.fillStyle = "rgba(0,0,0,0.35)"; g.fillRect(0, y, s, 5); g.fillStyle = "rgba(255,255,255,0.3)"; g.fillRect(0, y - 3, s, 3); }
    blotches(g, s, 6, "rgba(110,60,30,0.35)", 18); speckle(g, s, 2000, 0.2);
  }),
};

// Materials: { m: material, t: texture tile size in metres }
const std = (map, o = {}) => new THREE.MeshStandardMaterial({ map, roughness: 0.9, ...o });
const MAT = {
  dirt: { m: std(TEX.dirt), t: 4 },
  asphalt: { m: std(TEX.asphalt, { roughness: 0.85 }), t: 4 },
  concrete: { m: std(TEX.concrete), t: 2 },
  brick: { m: std(TEX.brick), t: 2 },
  plaster: { m: std(TEX.plaster), t: 3 },
  roof: { m: std(TEX.roof), t: 2 },
  wood: { m: std(TEX.wood), t: 1 },
  sandbag: { m: std(TEX.sandbag, { roughness: 1 }), t: 1 },
  canvas: { m: std(TEX.canvas, { roughness: 1 }), t: 2 },
};
const crateMat = std(TEX.crate);
const glassMat = new THREE.MeshStandardMaterial({ color: 0x22303a, roughness: 0.15, metalness: 0.6 });
const frameMat = new THREE.MeshStandardMaterial({ color: 0xe0dccf, roughness: 0.8 });
const metalDark = new THREE.MeshStandardMaterial({ color: 0x3b3e42, metalness: 0.6, roughness: 0.45 });
const tireMat = new THREE.MeshStandardMaterial({ color: 0x161616, roughness: 0.95 });
const cache = {};
const tinted = (tex, hex, o) => cache[tex + hex] ??= std(TEX[tex], { color: hex, ...o });
const containerMat = (hex) => ({ m: tinted("metal", hex, { roughness: 0.6, metalness: 0.2 }), t: 2 });

// ---------- Geometry helpers ----------
const obstacles = [];  // solid things the player and enemies collide with: { mesh, box }
const shootables = []; // everything bullets can hit
function scaleUV(geo, sx, sy) {
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * sx, uv.getY(i) * sy);
  return geo;
}
// Box whose textures tile by world size instead of stretching
function boxGeo(w, h, d, tile) {
  const g = new THREE.BoxGeometry(w, h, d), uv = g.attributes.uv;
  const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++) {
    const k = f * 4 + i;
    uv.setXY(k, uv.getX(k) * dims[f][0] / tile, uv.getY(k) * dims[f][1] / tile);
  }
  return g;
}
function addSolid(mesh) {
  mesh.updateMatrixWorld();
  obstacles.push({ mesh, box: new THREE.Box3().setFromObject(mesh) });
  shootables.push(mesh);
}
// y is the bottom of the block
function addBlock(x, y, z, w, h, d, kind, { solid = true, shadow = true, rotY = 0 } = {}) {
  const k = typeof kind === "string" ? MAT[kind] : kind;
  const mesh = new THREE.Mesh(boxGeo(w, h, d, k.t), k.m);
  mesh.position.set(x, y + h / 2, z);
  mesh.rotation.y = rotY;
  mesh.castShadow = shadow;
  mesh.receiveShadow = true;
  scene.add(mesh);
  if (solid) addSolid(mesh); else shootables.push(mesh);
  return mesh;
}
function flat(x, z, w, d, y, kind) {
  const k = typeof kind === "string" ? MAT[kind] : kind;
  const geo = k.t ? scaleUV(new THREE.PlaneGeometry(w, d), w / k.t, d / k.t) : new THREE.PlaneGeometry(w, d);
  const mesh = new THREE.Mesh(geo, k.m);
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.set(x, y, z);
  mesh.receiveShadow = true;
  scene.add(mesh);
  shootables.push(mesh);
  return mesh;
}

// ---------- Ground, roads, sidewalks ----------
const HALF = 50;
flat(0, 0, 240, 240, 0, "dirt");
flat(0, 0, HALF * 2, 10, 0.01, "asphalt");
flat(0, 27.5, 10, 45, 0.01, "asphalt");
flat(0, -27.5, 10, 45, 0.01, "asphalt");

const paint = (hex) => ({ m: new THREE.MeshStandardMaterial({ color: hex, roughness: 0.8, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }) });
const white = paint(0xd8d8d0), yellow = paint(0xd9b43a);
for (let a = -48; a <= 48; a += 4) {
  if (Math.abs(a) < 11) continue;
  flat(a, 0, 2, 0.15, 0.02, yellow);  // centre dashes
  flat(0, a, 0.15, 2, 0.02, yellow);
}
for (const s of [-1, 1]) for (const e of [-4.6, 4.6]) {
  flat(s * 29.5, e, 41, 0.15, 0.02, white); // edge lines
  flat(e, s * 29.5, 0.15, 41, 0.02, white);
}
for (const s of [-1, 1]) for (let c = -4; c <= 4; c += 1.1) { // zebra crossings
  flat(s * 7.5, c, 3, 0.55, 0.02, white);
  flat(c, s * 7.5, 0.55, 3, 0.02, white);
}
const stainMat = { m: new THREE.MeshBasicMaterial({ color: 0, transparent: true, opacity: 0.22, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 }) };
for (let i = 0; i < 18; i++) {
  const along = rand(-46, 46), across = rand(-3.5, 3.5);
  const m = Math.random() < 0.5 ? flat(along, across, 1, 1, 0.025, stainMat) : flat(across, along, 1, 1, 0.025, stainMat);
  m.geometry = new THREE.CircleGeometry(0.5, 20);
  m.scale.set(rand(1, 3), rand(0.8, 2), 1);
}
for (const sx of [-1, 1]) for (const sz of [-1, 1]) { // kerbed sidewalks
  addBlock(sx * 27.5, 0, sz * 6, 45, 0.15, 2, "concrete", { shadow: false });
  addBlock(sx * 6, 0, sz * 28.5, 2, 0.15, 43, "concrete", { shadow: false });
}

// ---------- Perimeter wall ----------
addBlock(0, 0, -HALF, HALF * 2 + 1, 4.5, 1, "concrete");
addBlock(0, 0, HALF, HALF * 2 + 1, 4.5, 1, "concrete");
addBlock(-HALF, 0, 0, 1, 4.5, HALF * 2, "concrete");
addBlock(HALF, 0, 0, 1, 4.5, HALF * 2, "concrete");
for (let a = -HALF; a <= HALF; a += 10) for (const s of [-1, 1]) {
  addBlock(a, 0, s * (HALF - 0.4), 0.8, 4.9, 1.4, "concrete");
  addBlock(s * (HALF - 0.4), 0, a, 1.4, 4.9, 0.8, "concrete");
}
const gate = containerMat(0x3d4a3a);
for (const s of [-1, 1]) {
  addBlock(0, 0, s * (HALF - 0.7), 9.6, 4, 0.3, gate);
  addBlock(s * (HALF - 0.7), 0, 0, 0.3, 4, 9.6, gate);
}

// ---------- Buildings ----------
const windows = []; // instanced later
function addBuilding(cx, cz, w, d, h, kind, doors) {
  const T = 0.3, DW = 1.7, DH = 2.4, floors = h > 6 ? 2 : 1;
  const sides = [
    { k: "n", x: cx, z: cz - d / 2, len: w, alongX: true, rot: Math.PI },
    { k: "s", x: cx, z: cz + d / 2, len: w, alongX: true, rot: 0 },
    { k: "w", x: cx - w / 2, z: cz, len: d, alongX: false, rot: -Math.PI / 2 },
    { k: "e", x: cx + w / 2, z: cz, len: d, alongX: false, rot: Math.PI / 2 },
  ];
  for (const s of sides) {
    const seg = (off, len, y, hh) => s.alongX ? addBlock(s.x + off, y, s.z, len, hh, T, kind) : addBlock(s.x, y, s.z + off, T, hh, len, kind);
    const door = doors.includes(s.k);
    if (door) {
      const L = (s.len - DW) / 2;
      seg(-(DW + L) / 2, L, 0, h); seg((DW + L) / 2, L, 0, h); seg(0, DW, DH, h - DH);
    } else seg(0, s.len, 0, h);
    const n = Math.max(1, Math.floor(s.len / 3));
    for (let f = 0; f < floors; f++) for (let i = 0; i < n; i++) {
      const p = -s.len / 2 + (i + 0.5) * s.len / n;
      if ((door && f === 0 && Math.abs(p) < 1.8) || Math.abs(p) > s.len / 2 - 1) continue;
      const y = 1.6 + f * 3.6;
      const m = new THREE.Matrix4().makeRotationY(s.rot);
      m.setPosition(s.alongX ? s.x + p : s.x, y, s.alongX ? s.z : s.z + p);
      windows.push(m);
    }
  }
  flat(cx, cz, w - T, d - T, 0.02, "concrete");
  if (floors === 2) addBlock(cx, 3.6, cz, w - T, 0.25, d - T, "concrete");
  addBlock(cx, h, cz, w + 0.3, 0.3, d + 0.3, "roof");
  const py = h + 0.3, o = { solid: false };
  addBlock(cx, py, cz - d / 2, w + 0.3, 0.5, 0.25, kind, o);
  addBlock(cx, py, cz + d / 2, w + 0.3, 0.5, 0.25, kind, o);
  addBlock(cx - w / 2, py, cz, 0.25, 0.5, d, kind, o);
  addBlock(cx + w / 2, py, cz, 0.25, 0.5, d, kind, o);
}

// ---------- Props ----------
function crate(x, z, s = 1.2, y = 0) { addBlock(x, y, z, s, s, s, { m: crateMat, t: s }); }
function crateStack(x, z) { crate(x, z); crate(x + 1.25, z); crate(x + 0.6, z, 1.2, 1.2); }
const barrelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.9, 16);
function barrel(x, z, hex) {
  const m = new THREE.Mesh(barrelGeo, tinted("barrel", hex, { roughness: 0.5, metalness: 0.3 }));
  m.position.set(x, 0.45, z);
  m.castShadow = m.receiveShadow = true;
  scene.add(m); addSolid(m);
}
function barrels(x, z, hex, n) { for (let i = 0; i < n; i++) barrel(x + (i % 3) * 0.65, z + Math.floor(i / 3) * 0.65, hex); }
function container(x, z, alongX, hex, y = 0) {
  addBlock(x, y, z, alongX ? 6.06 : 2.44, 2.59, alongX ? 2.44 : 6.06, containerMat(hex));
}
function sandbags(x, z, w, d, h = 1) { addBlock(x, 0, z, w, h, d, "sandbag"); }
function nest(x, z) { sandbags(x, z - 1.2, 3.2, 0.6); sandbags(x - 1.3, z, 0.6, 1.8); sandbags(x + 1.3, z, 0.6, 1.8); }
function extruded(points, depth, mat, x, z, rotY) {
  const geo = new THREE.ExtrudeGeometry(new THREE.Shape(points.map(([a, b]) => new THREE.Vector2(a, b))), { depth, bevelEnabled: false });
  geo.translate(0, 0, -depth / 2);
  geo.rotateY(rotY);
  scaleUV(geo, 0.5, 0.5);
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, 0, z);
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
  return m;
}
function jersey(x, z, len, alongX) {
  const m = extruded([[-0.3, 0], [0.3, 0], [0.12, 0.3], [0.1, 0.8], [-0.1, 0.8], [-0.12, 0.3]], len, MAT.concrete.m, x, z, alongX ? Math.PI / 2 : 0);
  addSolid(m);
}
function tent(x, z, w, d) {
  addBlock(x, 0, z, w, 1.8, d, "canvas");
  const roof = extruded([[-d / 2 - 0.15, 0], [d / 2 + 0.15, 0], [0, 1.1]], w + 0.3, MAT.canvas.m, x, z, Math.PI / 2);
  roof.position.y = 1.8;
  shootables.push(roof);
}
function car(x, z, alongX, hex) {
  const body = { m: tinted("rust", hex, { roughness: 0.6, metalness: 0.4 }), t: 2 };
  const L = 4.3, W = 1.8, dims = (a, b) => alongX ? [a, b] : [b, a];
  let [w, d] = dims(L, W);
  addBlock(x, 0.3, z, w, 0.75, d, body);
  const cx = alongX ? x - 0.3 : x, cz = alongX ? z : z - 0.3;
  [w, d] = dims(2.2, 1.6); addBlock(cx, 1.05, cz, w, 0.57, d, { m: glassMat, t: 1 });
  [w, d] = dims(2.3, 1.68); addBlock(cx, 1.6, cz, w, 0.08, d, body, { solid: false });
  for (const a of [-1.4, 1.4]) for (const b of [-0.85, 0.85]) {
    const wh = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.26, 14), tireMat);
    if (alongX) { wh.rotation.x = Math.PI / 2; wh.position.set(x + a, 0.36, z + b); }
    else { wh.rotation.z = Math.PI / 2; wh.position.set(x + b, 0.36, z + a); }
    wh.castShadow = true;
    scene.add(wh);
  }
}
function lamp(x, z, dx, dz) {
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 5, 8), metalDark);
  pole.position.set(x, 2.5, z);
  pole.castShadow = true;
  scene.add(pole); addSolid(pole);
  const arm = { m: metalDark, t: 1 };
  addBlock(x + dx * 0.7, 4.9, z + dz * 0.7, dx ? 1.4 : 0.08, 0.08, dz ? 1.4 : 0.08, arm, { solid: false });
  addBlock(x + dx * 1.35, 4.75, z + dz * 1.35, dx ? 0.6 : 0.3, 0.15, dz ? 0.6 : 0.3,
    { m: new THREE.MeshStandardMaterial({ color: 0xfff3c0, emissive: 0xffe9a0, emissiveIntensity: 0.4 }), t: 1 }, { solid: false });
}
function stall(x, z, clothHex) {
  addBlock(x, 0, z, 2.4, 0.9, 1, "wood");
  for (const a of [-1.3, 1.3]) for (const b of [-0.75, 0.75]) addBlock(x + a, 0, z + b, 0.08, 2.45, 0.08, "wood", { solid: false });
  const canopy = new THREE.Mesh(new THREE.BoxGeometry(2.9, 0.05, 1.9), new THREE.MeshStandardMaterial({ color: clothHex, roughness: 1 }));
  canopy.position.set(x, 2.5, z);
  canopy.rotation.x = -0.12;
  canopy.castShadow = true;
  scene.add(canopy);
  for (let i = 0; i < 4; i++) addBlock(x - 0.85 + i * 0.57, 0.9, z, 0.45, 0.25, 0.6, { m: crateMat, t: 0.6 }, { solid: false });
}
const barkMat = new THREE.MeshStandardMaterial({ color: 0x4a3626, roughness: 1 });
const leafMats = [0x2f4a26, 0x3a5a2c, 0x29421f].map((c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.9, flatShading: true }));
function tree(x, z, s = 1, solid = true) {
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15 * s, 0.25 * s, 2.4 * s, 7), barkMat);
  trunk.position.set(x, 1.2 * s, z);
  trunk.castShadow = true;
  scene.add(trunk);
  if (solid) addSolid(trunk);
  const leaf = leafMats[Math.floor(Math.random() * 3)];
  if (Math.random() < 0.5) {
    for (let i = 0; i < 3; i++) {
      const c = new THREE.Mesh(new THREE.ConeGeometry((1.8 - i * 0.45) * s, 2.4 * s, 8), leaf);
      c.position.set(x, (2.4 + i * 1.2) * s, z);
      c.castShadow = true; scene.add(c);
    }
  } else {
    for (let i = 0; i < 3; i++) {
      const b = new THREE.Mesh(new THREE.IcosahedronGeometry(rand(1.2, 1.8) * s, 1), leaf);
      b.position.set(x + rand(-0.7, 0.7) * s, rand(3, 4) * s, z + rand(-0.7, 0.7) * s);
      b.castShadow = true; scene.add(b);
    }
  }
}
function watchtower(x, z) {
  const s = 2.6, H = 4, P = s + 0.6;
  for (const a of [-1, 1]) for (const b of [-1, 1]) {
    addBlock(x + a * s / 2, 0, z + b * s / 2, 0.25, H, 0.25, "wood");
    addBlock(x + a * s / 2, H, z + b * s / 2, 0.12, 2.4, 0.12, "wood", { solid: false });
  }
  addBlock(x, H, z, P, 0.2, P, "wood");
  addBlock(x, H + 0.2, z - P / 2 + 0.25, P, 0.8, 0.5, "sandbag", { solid: false });
  addBlock(x, H + 0.2, z + P / 2 - 0.25, P, 0.8, 0.5, "sandbag", { solid: false });
  addBlock(x - P / 2 + 0.25, H + 0.2, z, 0.5, 0.8, P - 1, "sandbag", { solid: false });
  addBlock(x + P / 2 - 0.25, H + 0.2, z, 0.5, 0.8, P - 1, "sandbag", { solid: false });
  addBlock(x, H + 2.4, z, P + 0.4, 0.15, P + 0.4, "roof", { solid: false });
  for (let y = 0.4; y < H; y += 0.4) addBlock(x, y, z + s / 2 + 0.2, 0.6, 0.06, 0.06, "wood", { solid: false }); // ladder rungs
}

// --- Town (north-east) ---
addBuilding(19, 22, 12, 10, 7.2, "brick", ["n", "e"]);
addBuilding(37, 17, 9, 8, 4, "plaster", ["n", "w"]);
addBuilding(20, 40, 10, 8, 4, "plaster", ["n", "w"]);
addBuilding(38, 37, 9, 9, 4.5, "brick", ["w", "n"]);
crate(16, 25); crate(17.3, 25); crate(16.6, 25, 1.2, 1.2);
crateStack(28, 12);
barrels(29.5, 28, 0x2d5a8c, 3);
addBlock(27, 0, 31, 2, 1.3, 1.2, containerMat(0x2e5a3a)); // dumpster
car(3.4, 22, false, 0xd8d8d8);
tree(11, 12); tree(45, 26); tree(11, 46, 1.1);

// --- Market (north-west) ---
addBuilding(-20, 30, 12, 9, 4, "plaster", ["n", "e"]);
addBuilding(-39, 17, 8, 10, 7.2, "brick", ["e", "s"]);
addBuilding(-40, 40, 10, 9, 4, "plaster", ["e"]);
stall(-14, 13, 0xa83232); stall(-19, 13, 0x2f5f9e); stall(-24, 13, 0xc9a227); stall(-29, 13, 0x3c7a3c);
tree(-12, 22); tree(-30, 21, 0.9); tree(-28, 45); tree(-12, 45, 1.2);
barrels(-34, 24, 0x6b4a2a, 2);
crateStack(-30, 36);
car(-24, 2.8, true, 0x8c2a22);
car(-38, -2.6, true, 0x2a4a7a);

// --- Container yard (south-west) ---
container(-14, -14, true, 0x9c2b22); container(-21, -14, true, 0x2a4f8a); container(-17.5, -14, true, 0x2f6b3a, 2.59);
container(-32, -18, false, 0xc0661f); container(-35, -18, false, 0x7a7d80); container(-35, -18, false, 0x9c2b22, 2.59);
container(-32, -30, false, 0x2a4f8a);
container(-16, -30, true, 0x2f6b3a); container(-16, -34, true, 0xc0661f); container(-16, -34, true, 0x7a7d80, 2.59);
container(-42, -42, true, 0x2a4f8a); container(-42, -38.5, true, 0x9c2b22);
container(-25, -44, true, 0x2f6b3a);

// --- Military checkpoint (south-east) ---
addBuilding(16, -15, 7, 6, 3.4, "concrete", ["s", "e"]);
tent(32, -16, 6, 4); tent(32, -24, 6, 4); tent(42, -16, 6, 4);
watchtower(44, -44);
nest(20, -30); nest(24, -42);
jersey(20, -3, 4, false); jersey(26, 3, 4, false);
jersey(-3, -20, 4, true); jersey(3, -26, 4, true);
jersey(12, -9.5, 3, true); jersey(20, -9.5, 3, true);
barrels(38, -32, 0x4a5a2a, 6);
crateStack(26, -20);
car(3, -36, false, 0x6d6d6d);

// Street lamps along the sidewalks
for (const s of [-1, 1]) for (const a of [12, 24, 36, 46]) {
  lamp(a * s, 6.6, 0, -1); lamp(a * s, -6.6, 0, 1);
  lamp(6.6, a * s, -1, 0); lamp(-6.6, a * s, 1, 0);
}
// Trees outside the wall for a skyline
for (let i = 0; i < 90; i++) {
  const ang = Math.random() * Math.PI * 2, r = rand(56, 110);
  tree(Math.cos(ang) * r, Math.sin(ang) * r, rand(1, 1.8), false);
}
// Window instances (frame, glass, sill) — glass is deeper than the wall so it shows inside too
for (const [geo, mat] of [
  [new THREE.BoxGeometry(1.4, 1.6, 0.32), frameMat],
  [new THREE.BoxGeometry(1.2, 1.4, 0.34), glassMat],
  [new THREE.BoxGeometry(1.6, 0.08, 0.3).translate(0, -0.82, 0.2), MAT.concrete.m],
]) {
  const im = new THREE.InstancedMesh(geo, mat, windows.length);
  windows.forEach((m, i) => im.setMatrixAt(i, m));
  im.frustumCulled = false;
  im.receiveShadow = true;
  scene.add(im);
}

// ---------- Weapon ----------
const gun = new THREE.Group();
const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.09, 0.4), new THREE.MeshStandardMaterial({ color: 0x3a3a3a, metalness: 0.2, roughness: 0.5 }));
const barrelMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.25, 8), new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.4 }));
barrelMesh.rotation.x = Math.PI / 2;
barrelMesh.position.z = -0.3;
gun.add(gunBody, barrelMesh);
gun.position.set(0.2, -0.2, -0.6);
camera.add(gun);
const flash = new THREE.PointLight(0xffaa33, 0, 8);
flash.position.set(0.25, -0.2, -1);
camera.add(flash);

// ---------- State ----------
const state = { hp: 100, ammo: 12, maxAmmo: 12, reloading: false, score: 0, wave: 0, alive: true, lastShot: 0 };
const PLAYER_H = 1.7, PLAYER_R = 0.4, STEP = 0.45;
const velocity = new THREE.Vector3();
const keys = {};
let onGround = true;

const $ = (id) => document.getElementById(id);
function updateHud() {
  $("hpfill").style.width = Math.max(0, state.hp) + "%";
  $("ammo").textContent = state.reloading ? "…" : state.ammo;
  $("wave").textContent = state.wave;
  $("score").textContent = state.score;
}

// ---------- Enemies ----------
const enemies = [];
const enemyGeo = new THREE.BoxGeometry(1, 1.8, 1);
function spawnEnemy() {
  let x, z;
  do { x = rand(-46, 46); z = rand(-46, 46); }
  while (camera.position.distanceTo(new THREE.Vector3(x, 0, z)) < 18 || enemyBlocked(new THREE.Vector3(x, 0, z)));
  const mat = new THREE.MeshStandardMaterial({ color: 0xcc2222, emissive: 0x330000 });
  const m = new THREE.Mesh(enemyGeo, mat);
  const eye = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.15, 0.05), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
  eye.position.set(0, 0.5, 0.51);
  m.add(eye);
  m.position.set(x, 0.9, z);
  m.castShadow = true;
  scene.add(m);
  enemies.push({ mesh: m, hp: 3, speed: rand(2.5, 3.5) + state.wave * 0.3, hitTimer: 0, attackCd: 0, stuckT: 0, detourT: 0, detour: null });
}
function nextWave() {
  state.wave++;
  for (let i = 0; i < 3 + state.wave * 2; i++) spawnEnemy();
  updateHud();
}

// ---------- Collision ----------
// Ignores things low enough to step onto and things above the player's head
function collides(pos, r) {
  const feet = pos.y - PLAYER_H;
  for (const o of obstacles) {
    const b = o.box;
    if (feet > b.max.y - STEP || pos.y + 0.1 < b.min.y) continue;
    const cx = Math.max(b.min.x, Math.min(pos.x, b.max.x));
    const cz = Math.max(b.min.z, Math.min(pos.z, b.max.z));
    if ((pos.x - cx) ** 2 + (pos.z - cz) ** 2 < r * r) return o;
  }
  return null;
}
function groundHeightAt(pos) {
  const feet = pos.y - PLAYER_H;
  let h = 0;
  for (const o of obstacles) {
    const b = o.box;
    if (pos.x > b.min.x - PLAYER_R && pos.x < b.max.x + PLAYER_R &&
        pos.z > b.min.z - PLAYER_R && pos.z < b.max.z + PLAYER_R &&
        feet >= b.max.y - STEP) h = Math.max(h, b.max.y);
  }
  return h;
}
function enemyBlocked(p) {
  for (const o of obstacles) {
    const b = o.box;
    if (b.max.y < 0.5 || b.min.y > 1.8) continue; // kerbs and overhead structures
    if (p.x > b.min.x - 0.5 && p.x < b.max.x + 0.5 && p.z > b.min.z - 0.5 && p.z < b.max.z + 0.5) return true;
  }
  return false;
}

// ---------- Shooting ----------
const raycaster = new THREE.Raycaster();
const tracers = [];
function shoot() {
  if (!state.alive || state.reloading || !controls.isLocked) return;
  const now = performance.now();
  if (now - state.lastShot < 150) return;
  if (state.ammo <= 0) { reload(); return; }
  state.lastShot = now;
  state.ammo--;
  flash.intensity = 30;
  gun.position.z = -0.52; // recoil

  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  const hit = raycaster.intersectObjects([...enemies.map(e => e.mesh), ...shootables], true)[0];
  const end = hit ? hit.point : raycaster.ray.at(100, new THREE.Vector3());

  // tracer
  const start = new THREE.Vector3(0.2, -0.18, -0.9).applyMatrix4(camera.matrixWorld);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([start, end]),
    new THREE.LineBasicMaterial({ color: 0xffee88, transparent: true }));
  scene.add(line);
  tracers.push({ line, life: 0.06 });

  if (hit) {
    let obj = hit.object;
    while (obj && !enemies.find(e => e.mesh === obj)) obj = obj.parent;
    const enemy = enemies.find(e => e.mesh === obj);
    if (enemy) {
      enemy.hp--;
      enemy.hitTimer = 0.1;
      enemy.mesh.position.add(raycaster.ray.direction.clone().setY(0).multiplyScalar(0.4));
      if (enemy.hp <= 0) killEnemy(enemy);
    }
  }
  if (state.ammo === 0) reload();
  updateHud();
}
function killEnemy(e) {
  scene.remove(e.mesh);
  enemies.splice(enemies.indexOf(e), 1);
  state.score += 100;
  if (enemies.length === 0) setTimeout(nextWave, 1500);
}
function reload() {
  if (state.reloading || state.ammo === state.maxAmmo) return;
  state.reloading = true;
  updateHud();
  setTimeout(() => { state.ammo = state.maxAmmo; state.reloading = false; updateHud(); }, 1200);
}

// ---------- Input ----------
addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (e.code === "Space" && onGround && state.alive) { velocity.y = 7; onGround = false; }
  if (e.code === "KeyR") reload();
});
addEventListener("keyup", (e) => (keys[e.code] = false));
addEventListener("mousedown", (e) => { if (e.button === 0) shoot(); });
$("overlay").addEventListener("click", () => {
  if (!state.alive) resetGame();
  controls.lock();
});
controls.addEventListener("lock", () => ($("overlay").style.display = "none"));
controls.addEventListener("unlock", () => {
  $("overlay").style.display = "flex";
  if (state.alive) $("msg").textContent = "Paused — click to resume";
});

function resetGame() {
  for (const e of enemies) scene.remove(e.mesh);
  enemies.length = 0;
  Object.assign(state, { hp: 100, ammo: 12, reloading: false, score: 0, wave: 0, alive: true });
  camera.position.set(0, PLAYER_H, 0);
  velocity.set(0, 0, 0);
  nextWave();
}
function die() {
  state.alive = false;
  controls.unlock();
  $("msg").textContent = `You died on wave ${state.wave} with ${state.score} points — click to restart`;
}

// ---------- Loop ----------
const clock = new THREE.Clock();
const fwd = new THREE.Vector3(), right = new THREE.Vector3();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);

  if (controls.isLocked && state.alive) {
    // Movement
    const speed = keys.ShiftLeft ? 9 : 5.5;
    camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
    right.crossVectors(fwd, camera.up);
    const move = new THREE.Vector3();
    if (keys.KeyW) move.add(fwd);
    if (keys.KeyS) move.sub(fwd);
    if (keys.KeyD) move.add(right);
    if (keys.KeyA) move.sub(right);
    if (move.lengthSq()) move.normalize().multiplyScalar(speed * dt);

    const pos = camera.position;
    const old = pos.clone();
    pos.x += move.x; if (collides(pos, PLAYER_R)) pos.x = old.x;
    pos.z += move.z; if (collides(pos, PLAYER_R)) pos.z = old.z;

    velocity.y -= 20 * dt;
    pos.y += velocity.y * dt;
    const ground = groundHeightAt(old) + PLAYER_H;
    if (pos.y <= ground) { pos.y = ground; velocity.y = 0; onGround = true; }
    else onGround = false;

    // Gun bob
    const t = clock.elapsedTime;
    const bob = move.lengthSq() && onGround ? Math.sin(t * 12) * 0.015 : 0;
    gun.position.y = -0.2 + bob;
    gun.position.z += (-0.6 - gun.position.z) * 10 * dt;

    // Enemies: chase the player, sidestep when stuck on cover
    for (const e of enemies) {
      const m = e.mesh;
      const to = new THREE.Vector3(pos.x - m.position.x, 0, pos.z - m.position.z);
      const dist = to.length();
      m.lookAt(pos.x, m.position.y, pos.z);
      if (dist > 1.4) {
        to.normalize();
        let dir = to;
        if (e.detourT > 0) { e.detourT -= dt; dir = e.detour; }
        const px = m.position.x, pz = m.position.z;
        m.position.x += dir.x * e.speed * dt; if (enemyBlocked(m.position)) m.position.x = px;
        m.position.z += dir.z * e.speed * dt; if (enemyBlocked(m.position)) m.position.z = pz;
        if (Math.hypot(m.position.x - px, m.position.z - pz) < e.speed * dt * 0.3) {
          e.stuckT += dt;
          if (e.stuckT > 0.3) {
            const side = Math.random() < 0.5 ? 1 : -1;
            e.detour = new THREE.Vector3(-to.z * side, 0, to.x * side);
            e.detourT = rand(0.8, 1.6);
            e.stuckT = 0;
          }
        } else e.stuckT = 0;
        m.position.y = 0.9 + Math.abs(Math.sin(t * 8 + m.id)) * 0.15;
      }
      e.attackCd -= dt;
      if (dist < 1.6 && e.attackCd <= 0) {
        e.attackCd = 0.8;
        state.hp -= 10;
        $("damage").style.opacity = 1;
        setTimeout(() => ($("damage").style.opacity = 0), 150);
        updateHud();
        if (state.hp <= 0) die();
      }
      e.hitTimer -= dt;
      m.material.emissive.setHex(e.hitTimer > 0 ? 0xffffff : 0x330000);
    }
  }

  flash.intensity *= 0.6;
  for (let i = tracers.length - 1; i >= 0; i--) {
    tracers[i].life -= dt;
    if (tracers[i].life <= 0) { scene.remove(tracers[i].line); tracers[i].line.geometry.dispose(); tracers.splice(i, 1); }
  }

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

camera.position.set(0, PLAYER_H, 0);
camera.lookAt(0, PLAYER_H, 20);
nextWave();
tick();
</script>
